<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Starmeet — Message Your Favourite Celebrities Directly</title>
    <meta name="description" content="DM your favourite actor, musician or athlete and actually get a reply. Not a bot. Not an assistant. The celebrity. Join 500,000+ fans on Starmeet." />
    <meta name="keywords" content="celebrity chat, message celebrities, DM celebrities, fan platform, celebrity messaging app" />
    <meta name="author" content="Starmeet" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Starmeet" />
    <meta property="og:title"       content="Starmeet — Message Your Favourite Celebrities Directly" />
    <meta property="og:description" content="DM your favourite actor, musician or athlete and actually get a reply. Join 500,000+ fans on Starmeet. Starting free." />
    <meta property="og:image"       content="https://starmeet.app/og-image.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url"         content="https://starmeet.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@starmeet" />
    <meta name="twitter:title"       content="Starmeet — Message Your Favourite Celebrities" />
    <meta name="twitter:description" content="DM your favourite actor, musician or athlete. Real replies. Starting free." />
    <meta name="twitter:image"       content="https://starmeet.app/og-image.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://starmeet.app" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://ui-avatars.com" />

    <!-- Structured data (Google Rich Results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Starmeet",
      "url": "https://starmeet.app",
      "description": "Message your favourite celebrities directly. DM actors, musicians and athletes and get real replies.",
      "applicationCategory": "SocialNetworkingApplication",
      "operatingSystem": "Any",
      "offers": [
        {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free plan — 5 messages per celebrity"
        },
        {
          "@type": "Offer",
          "price": "9",
          "priceCurrency": "USD",
          "description": "Pro plan — unlimited messages"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
